name: Build Abyss Tendril Boss V6 (NeoForge 1.21.1)
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Restore V6 model, animations and texture
        run: |
          gzip -dc assets-v6/abyss_tendril_beast.geo.json.gz > src/main/resources/assets/abysstendril/geo/abyss_tendril_beast.geo.json
          gzip -dc assets-v6/abyss_tendril_beast.animation.json.gz > src/main/resources/assets/abysstendril/animations/abyss_tendril_beast.animation.json
          gzip -dc assets-v6/abyss_tendril_beast.png.gz > src/main/resources/assets/abysstendril/textures/entity/abyss_tendril_beast.png
      - name: Build NeoForge Mod
        run: gradle build --no-daemon --stacktrace
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: AbyssTendrilBoss-V6-NeoForge-1.21.1
          path: build/libs/*.jar
          if-no-files-found: error
